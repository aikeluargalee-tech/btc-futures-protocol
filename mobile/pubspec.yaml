name: btc_futures_protocol
description: BTC Desk v4 — Short-Term 4H Futures Telemetry, AI Copilot Export & Paper Protocol Monitor.
publish_to: "none"
version: 4.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_mobile_ads: ^5.2.0
  video_player: ^2.9.2
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/video/vGUZF.mp4
    - assets/flags/
  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
